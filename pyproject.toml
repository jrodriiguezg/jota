[project]
name = "jota"
version = "0.2.0"
description = "Asistente de voz local - Fase 2 (Herramientas)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "llama-cpp-python>=0.3.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "evdev>=1.7.0",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
bridge = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
jota = "jota.main:main"
jota-bridge = "bridge.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jota*", "bridge*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
