[project]
name = "jota"
version = "0.1.0"
description = "Asistente de voz local - Fase 1"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "llama-cpp-python>=0.3.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "evdev>=1.7.0",
    "piper-tts>=1.2.0",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
jota = "jota.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
