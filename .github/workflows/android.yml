name: Build Android APK (JotaLink)

on:
  push:
    branches:
      - main
      - bridge
      - jota-hub
    paths:
      - 'bridge/android/**'
      - '.github/workflows/android.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'bridge/android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JotaLink APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x bridge/android/gradlew

      - name: Build Debug APK
        run: |
          cd bridge/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JotaLink-APK
          path: bridge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bridge/android/app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
